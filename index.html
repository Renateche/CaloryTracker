<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifestyle Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="app-header"></header>

    <main class="container">
      <section class="card" id="signed-out-intro" hidden>
        <h2>Track your day, all in one place</h2>
        <p class="lede">
          Log meals, habits, workouts, sleep, water and mood. Everything is private to your account
          and synced across your devices. Sign in with GitHub to get started.
        </p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Today</h2>
          <span class="day-total" id="dashboard-date"></span>
        </div>
        <p id="dashboard-status" class="empty-state" hidden></p>
        <div class="tile-grid" id="tiles"></div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Your data is private to your account and stored in your own Supabase project.</p>
    </footer>

    <script type="module" src="js/features/dashboard.js"></script>
  </body>
</html>
