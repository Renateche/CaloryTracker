<!doctype html>

  <head>

    <title>Mood</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="mood-page" data-tracker="mood">
    <header class="app-header"></header>

    <main class="container">
      <span class="page-scene" aria-hidden="true">
        <span class="scene-cloud scene-pos-tl"></span>
        <span class="scene-cloud scene-pos-tr"></span>
        <span class="scene-ground"></span>
      </span>
      <section class="card">
        <div class="card-head">
          <h2>Coming soon</h2>

        <p class="lede">

        <p class="tile-detail">Table: <code id="stub-table"></code></p>
      </section>
    </main>

    <footer class="app-footer">
      <p>Part of Lifestyle Tracker.</p>
    </footer>
